name: Release

# Pushing a tag v<version> builds AutoDriveCourseEditor.exe and attaches it to a draft
# release on this repository; a person checks the draft and publishes it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Tag matches the crate version
        shell: bash
        run: bash .github/scripts/check-tag.sh "$GITHUB_REF_NAME"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p ad-app
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/AutoDriveCourseEditor.exe \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "AutoDrive Course Editor $GITHUB_REF_NAME" --generate-notes
