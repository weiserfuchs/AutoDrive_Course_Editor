name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # AD-1: ad-core has no UI, file or HTTP I/O, thread or settings dependency.
      - name: ad-core dependency check (AD-1)
        shell: bash
        run: |
          forbidden='^(egui|eframe|epaint|winit|wgpu|quick-xml|image|image_dds|zip|ureq|rfd|tokio|reqwest|rayon|crossbeam|directories|toml|serde) '
          if cargo tree -p ad-core -e normal --prefix none | grep -E "$forbidden"; then
            echo "ad-core depends on a crate AD-1 forbids"; exit 1
          fi
          if grep -rnE 'std::(fs|net|thread|process)' crates/ad-core/src; then
            echo "ad-core uses file, network, thread or process APIs (AD-1)"; exit 1
          fi
