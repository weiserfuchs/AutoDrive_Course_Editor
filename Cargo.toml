[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
rstar = "0.14.0"
eframe = "0.37.0"
quick-xml = "0.42.0"
thiserror = "2.0.21"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
directories = "6.0.0"
ad-core = { path = "crates/ad-core" }
ad-io = { path = "crates/ad-io" }
